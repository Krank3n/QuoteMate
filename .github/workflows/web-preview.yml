name: Web Preview

# Builds the Expo web export for a PR branch and deploys it to a per-PR Firebase
# Hosting preview channel on the `quotemate-staging` site, so changes can be
# reviewed in a browser BEFORE merging to main. Triggered from the QuoteMate
# admin Tasks board ("Preview (web)" button) via the GitHub API
# (workflow_dispatch), or manually from the Actions tab.
#
# Requires a FIREBASE_SERVICE_ACCOUNT secret (the JSON key for a service account
# with Firebase Hosting Admin on the `hansendev` project) on the repo
# (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref / branch to build (the PR head branch)"
        required: true
        default: "main"
      pr:
        description: "PR number to comment the preview URL on (optional)"
        required: false
        default: ""
      channel:
        description: "Preview channel id (defaults to pr-<pr> or the branch name)"
        required: false
        default: ""

jobs:
  preview:
    name: web preview (${{ inputs.ref }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web export
        run: npx expo export --platform web --output-dir dist-staging

      - name: Resolve channel id
        id: chan
        run: |
          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            if [ -n "${{ inputs.pr }}" ]; then
              CHANNEL="pr-${{ inputs.pr }}"
            else
              CHANNEL=$(echo "${{ inputs.ref }}" | tr '/' '-' | tr -cd 'a-zA-Z0-9-' | cut -c1-30)
            fi
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase preview channel
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          OUT=$(npx firebase-tools hosting:channel:deploy "${{ steps.chan.outputs.channel }}" \
            --config firebase.staging.json --project hansendev --expires 30d --json)
          echo "$OUT"
          URL=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.result||{};const k=Object.keys(r)[0];console.log((r[k]&&r[k].url)||'')}catch(e){console.log('')}})")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🌐 Web preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: ${{ inputs.pr != '' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const pr = Number("${{ inputs.pr }}");
            const marker = "<!-- web-preview -->";
            const body = `${marker}\n🌐 **Web preview ready:** ${url}\n\n_Built from \`${{ inputs.ref }}\`. Expires in 30 days. Re-run "Preview (web)" to refresh._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });
            }
